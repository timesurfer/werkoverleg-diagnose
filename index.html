<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werkoverleg Diagnose - Spanningsvelden</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #1a1a2e;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #059669, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
        }

        .version-info {
            font-size: 0.75rem;
            color: #888;
            margin-top: 5px;
        }

        .meta-inputs {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .meta-inputs input {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 10px 15px;
            border-radius: 8px;
            color: #333;
            font-size: 0.9rem;
        }

        .meta-inputs input::placeholder {
            color: #999;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .sliders-panel {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #e5e5e5;
        }

        .slider-group {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e5e5e5;
        }

        .slider-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .slider-title {
            font-weight: 600;
            font-size: 1rem;
            color: #1a1a2e;
        }

        .slider-poles {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 12px;
        }

        .pole-left { color: #059669; font-weight: 500; }
        .pole-right { color: #d97706; font-weight: 500; }

        .slider-track {
            position: relative;
            height: 40px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #059669 0%, #9ca3af 50%, #d97706 100%);
            border-radius: 4px;
            outline: none;
            position: absolute;
            top: 16px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #7c3aed;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .indicator-display {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 12px;
            min-height: 60px;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .indicator-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 5px;
        }

        .indicator-text {
            color: #555;
        }

        .indicator-text.left { color: #059669; }
        .indicator-text.right { color: #d97706; }

        .indicator-display.extreme {
            border: 2px solid;
        }

        .indicator-display.extreme.left-extreme {
            border-color: #059669;
            background: rgba(5, 150, 105, 0.08);
        }

        .indicator-display.extreme.right-extreme {
            border-color: #d97706;
            background: rgba(217, 119, 6, 0.08);
        }

        .extreme-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .extreme-label.left { color: #059669; }
        .extreme-label.right { color: #d97706; }

        .pattern-panel {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            border: 1px solid #e5e5e5;
        }

        .pattern-panel h2 {
            font-size: 1.2rem;
            color: #1a1a2e;
            margin-bottom: 15px;
        }

        .pattern-visual {
            margin: 20px 0;
        }

        .line {
            display: block;
            height: 12px;
            margin: 8px auto;
            width: 80px;
            border-radius: 3px;
            transition: all 0.3s;
        }

        .line {
            position: relative;
        }

        .line-num {
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.65rem;
            color: #999;
        }

        .line.left {
            background: linear-gradient(90deg, #059669 0%, #059669 40%, transparent 40%, transparent 60%, #059669 60%, #059669 100%);
        }

        .line.right {
            background: #d97706;
        }

        .line.attention {
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 8px currentColor;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pattern-summary {
            margin-top: 20px;
            text-align: left;
        }

        .pattern-summary h3 {
            font-size: 0.9rem;
            color: #7c3aed;
            margin-bottom: 8px;
        }

        .pattern-number {
            color: #999;
            font-weight: normal;
            margin-right: 4px;
        }

        .pattern-summary p {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 15px;
        }

        .attention-section {
            background: rgba(124, 58, 237, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }

        .attention-section h4 {
            color: #7c3aed;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .attention-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(124, 58, 237, 0.2);
        }

        .attention-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .attention-item strong {
            color: #7c3aed;
            font-size: 0.8rem;
        }

        .attention-item p {
            font-size: 0.8rem;
            color: #666;
            margin-top: 4px;
        }

        .shadow-warning {
            color: #dc2626;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .target-pattern {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #e5e5e5;
        }

        .target-pattern h3 {
            color: #7c3aed;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .target-pattern .pattern-visual .line {
            height: 8px;
            width: 50px;
        }

        .dialogue-section {
            margin-top: 30px;
            background: rgba(5, 150, 105, 0.05);
            border: 1px solid rgba(5, 150, 105, 0.2);
            border-radius: 12px;
            padding: 20px;
        }

        .dialogue-section h3 {
            color: #059669;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .dialogue-question {
            font-style: italic;
            color: #555;
            margin-bottom: 10px;
            padding-left: 15px;
            border-left: 3px solid #059669;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .action-btn.reset {
            background: #e5e5e5;
            color: #333;
        }

        .action-btn.print {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
        }

        .hidden { display: none !important; }

        @media print {
            body {
                background: white;
                color: black;
            }
            .actions { display: none; }
            .sliders-panel, .pattern-panel {
                background: #f5f5f5;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Werkoverleg Diagnose</h1>
            <p class="subtitle">Systemische analyse van spanningsvelden in tactisch overleg</p>
            <p class="version-info">Versie 2.1 • In lijn met DSM master</p>
        </header>

        <div class="meta-inputs">

            <input type="date" id="sessionDate">
        </div>

        <div class="main-content">

                <div class="pattern-summary" id="patternSummary"></div>

                <div class="attention-section hidden" id="attentionSection">
                    <h4>⚡ Aandachtspunten</h4>
                    <div id="attentionContent"></div>
                </div>

                <div class="target-pattern hidden" id="targetPattern">
                    <h3>→ Ontwikkeling naar</h3>
                    <div class="pattern-visual" id="targetPatternVisual"></div>
                    <div class="pattern-summary" id="targetPatternSummary"></div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn reset" onclick="resetAll()">🔄 Reset</button>
            <button class="action-btn print" onclick="window.print()">🖨️ Print / PDF</button>
        </div>
    </div>

let sliderValues = [50, 50, 50, 50, 50, 50];

// Set initial date
document.getElementById('sessionDate').valueAsDate = new Date();

// Dynamisch sliders genereren
function generateSliders() {
    const panel = document.getElementById('slidersPanel');
    let html = '';

    // Render from line 6 (top) to line 1 (bottom) to match hexagram order
    for (let i = 6; i >= 1; i--) {
        const sv = spanningsvelden[i];
        html += `
        <div class="slider-group" data-line="${i}">
            <div class="slider-header">
                <span class="slider-title">${i}. ${sv.naam}</span>
            </div>
            <div class="slider-poles">
                <span class="pole-left">← ${sv.leftLabel}</span>
                <span class="pole-right">${sv.rightLabel} →</span>
            </div>
            <div class="slider-track">
                <input type="range" min="0" max="100" value="50" data-line="${i}">
            </div>
            <div class="indicator-display">
                <div class="indicator-label">Observeerbaar gedrag</div>
                <div class="indicator-text" id="indicator-${i}"></div>
            </div>
        </div>
        `;
    }

    html += `
        <div class="dialogue-section">
            <h3>💬 Dialoogvragen</h3>
            <div id="dialogueQuestions"></div>
        </div>
    `;

    panel.innerHTML = html;

    // Event listeners
    document.querySelectorAll('input[type="range"]').forEach(slider => {
        slider.addEventListener('input', (e) => {
            const line = parseInt(e.target.dataset.line);
            sliderValues[line - 1] = parseInt(e.target.value);
            updateAll();
        });
    });
}

// 4-zone model: Teveel Links (0-19) | Links (20-49) | Rechts (50-80) | Teveel Rechts (81-100)
function getIndicatorText(line, value) {
    const sv = spanningsvelden[line];
    let text, cssClass, isExtreme = false, extremeData = null;

    if (value < 20) {
        const statements = sv.teveelLeft?.statements || [];
        const index = Math.min(Math.floor(value / 10), Math.max(0, statements.length - 1));
        text = statements[index] || statements[0] || '';
        cssClass = 'left';
        isExtreme = true;
        extremeData = sv.teveelLeft;
    } else if (value < 50) {
        const statements = sv.left?.statements || [];
        const index = Math.min(Math.floor((value - 20) / 8), Math.max(0, statements.length - 1));
        text = statements[index] || statements[0] || '';
        cssClass = 'left';
    } else if (value <= 80) {
        const statements = sv.right?.statements || [];
        const index = Math.min(Math.floor((value - 50) / 8), Math.max(0, statements.length - 1));
        text = statements[index] || statements[0] || '';
        cssClass = 'right';
    } else {
        const statements = sv.teveelRight?.statements || [];
        const index = Math.min(Math.floor((value - 81) / 10), Math.max(0, statements.length - 1));
        text = statements[index] || statements[0] || '';
        cssClass = 'right';
        isExtreme = true;
        extremeData = sv.teveelRight;
    }

    return { text, cssClass, isExtreme, extremeData };
}

function updateIndicator(line) {
    const value = sliderValues[line - 1];
    const { text, cssClass, isExtreme, extremeData } = getIndicatorText(line, value);
    const sv = spanningsvelden[line];

    const indicatorEl = document.getElementById(`indicator-${line}`);
    const displayEl = indicatorEl.parentElement;

    displayEl.classList.remove('extreme', 'left-extreme', 'right-extreme');

    let html = '';
    if (isExtreme && extremeData) {
        const extremeType = value < 20 ? 'left' : 'right';
        html = `<div class="extreme-label ${extremeType}">⚡ ${extremeData.label.toUpperCase()}</div>`;
        displayEl.classList.add('extreme', `${extremeType}-extreme`);
    }
    html += text;

    indicatorEl.innerHTML = html;
    indicatorEl.className = `indicator-text ${cssClass}`;
}

function valueToSide(value) {
    return value >= 50 ? 1 : 0; // 0 = left, 1 = right
}

function isAttentionLine(value) {
    return value < 20 || value > 80;
}

function updatePattern() {
    const visualEl = document.getElementById('patternVisual');
    const attentionSection = document.getElementById('attentionSection');
    const attentionContent = document.getElementById('attentionContent');
    const targetPattern = document.getElementById('targetPattern');

    let binary = '';
    let linesHtml = '';
    let attentionLines = [];
    let targetBinary = '';

    // Build pattern from bottom (line 1) to top (line 6)
    for (let i = 5; i >= 0; i--) {
        const value = sliderValues[i];
        const isRight = valueToSide(value);
        const isAttention = isAttentionLine(value);
        binary = (isRight ? '1' : '0') + binary;

        // Target pattern: flip attention lines
        const targetIsRight = isAttention ? (1 - isRight) : isRight;
        targetBinary = (targetIsRight ? '1' : '0') + targetBinary;

        const lineClass = isRight ? 'right' : 'left';
        const attentionClass = isAttention ? 'attention' : '';
        const lineNumber = i + 1;
        linesHtml += `<div class="line ${lineClass} ${attentionClass}" data-line="${lineNumber}"><span class="line-num">${lineNumber}</span></div>`;

        if (isAttention) {
            const sv = spanningsvelden[i + 1];
            const extremeData = value < 20 ? sv.teveelLeft : sv.teveelRight;
            attentionLines.push({
                line: i + 1,
                label: extremeData?.label || (value < 20 ? `Teveel ${sv.leftLabel}` : `Teveel ${sv.rightLabel}`),
                schaduw: extremeData?.schaduw || '',
                statement: extremeData?.statements?.[0] || ''
            });
        }
    }

    visualEl.innerHTML = linesHtml;

    // Pattern interpretation
    const summaryEl = document.getElementById('patternSummary');
    const patroon = patronen[binary];

    if (patroon) {
        let summaryHtml = `
            <h3><span class="pattern-number">${patroon.nummer}.</span> ${patroon.naam}</h3>
            <p><strong>${patroon.beschrijving}</strong></p>
            <p>${patroon.teamduiding}</p>
            <h3>Reflectievraag</h3>
            <p>${patroon.advies}</p>
            <h3>Schaduw</h3>
            <p>${patroon.schaduw}</p>
        `;
        summaryEl.innerHTML = summaryHtml;
    } else {
        // Fallback als patroon niet in database staat
        const leftCount = sliderValues.filter(v => v < 50).length;
        const rightCount = 6 - leftCount;
        summaryEl.innerHTML = `
            <h3>Patroon</h3>
            <p>${leftCount} van 6 spanningsvelden neigen naar de linkerpool, ${rightCount} naar de rechterpool.</p>
        `;
    }

    // Attention lines
    if (attentionLines.length > 0) {
        attentionSection.classList.remove('hidden');
        attentionContent.innerHTML = attentionLines.map(al => `
            <div class="attention-item">
                <strong>${al.label}</strong>
                ${al.statement ? `<p>${al.statement}</p>` : ''}
                ${al.schaduw ? `<p class="shadow-warning">⚠️ Schaduw: ${al.schaduw}</p>` : ''}
            </div>
        `).join('');

        // Show target pattern (what happens when attention lines flip)
        if (binary !== targetBinary) {
            targetPattern.classList.remove('hidden');
            const targetVisualEl = document.getElementById('targetPatternVisual');
            let targetHtml = '';
            for (let i = 5; i >= 0; i--) {
                const isRight = targetBinary[5 - i] === '1';
                const lineNumber = i + 1;
                targetHtml += `<div class="line ${isRight ? 'right' : 'left'}" data-line="${lineNumber}"><span class="line-num">${lineNumber}</span></div>`;
            }
            targetVisualEl.innerHTML = targetHtml;

            // Target pattern interpretation
            const targetSummaryEl = document.getElementById('targetPatternSummary');
            const targetPatroon = patronen[targetBinary];
            if (targetPatroon) {
                targetSummaryEl.innerHTML = `
                    <h4><span class="pattern-number">${targetPatroon.nummer}.</span> ${targetPatroon.naam}</h4>
                    <p>${targetPatroon.beschrijving}</p>
                    <p><em>${targetPatroon.teamduiding}</em></p>
                `;
            } else {
                const targetLeftCount = targetBinary.split('').filter(b => b === '0').length;
                targetSummaryEl.innerHTML = `<p>Verschuift naar ${targetLeftCount} links, ${6 - targetLeftCount} rechts.</p>`;
            }
        }
    } else {
        attentionSection.classList.add('hidden');
        targetPattern.classList.add('hidden');
    }
}

function updateDialogue() {
    const questions = [];

    sliderValues.forEach((val, i) => {
        if (val < 20 || val > 80) {
            const sv = spanningsvelden[i + 1];
            const poleName = val < 20 ? sv.leftLabel : sv.rightLabel;
            questions.push(`Bij <strong>${sv.naam}</strong> zie je veel ${poleName}-energie. Wat is het effect daarvan?`);
        }
    });

    if (questions.length === 0) {
        questions.push('De dynamiek tussen de polen lijkt in balans. Waar voelt het team de meeste spanning?');
    }

    questions.push('Wat valt op in dit beeld van jullie werkoverleg?');
    questions.push('Wat zou één kleine verschuiving kunnen zijn voor de volgende keer?');

    document.getElementById('dialogueQuestions').innerHTML =
        questions.map(q => `<p class="dialogue-question">${q}</p>`).join('');
}

function updateAll() {
    for (let i = 1; i <= 6; i++) {
        updateIndicator(i);
    }
    updatePattern();
    updateDialogue();
}

function resetAll() {
    sliderValues = [50, 50, 50, 50, 50, 50];
    document.querySelectorAll('input[type="range"]').forEach(s => s.value = 50);
    updateAll();
}

// Initialize
generateSliders();
updateAll();
</script>
</body>
</html>
